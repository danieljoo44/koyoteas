services:
  margin:
    build: .
    container_name: margin
    restart: unless-stopped
    ports:
      - "8787:8080"
    volumes:
      # SQLite database + daily backups live here on the host,
      # so they survive container rebuilds and updates.
      - ./data:/data
    # Optional: seed the passphrase on first boot instead of using the
    # in-app first-run screen.
    # environment:
    #   PASSPHRASE: "choose-a-long-passphrase"
