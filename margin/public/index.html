<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Margin</title>
<meta name="theme-color" content="#faf9f7">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/favicon-64.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Margin">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<header id="topbar">
  <div class="brand"><img src="/icons/icon-192.png" alt="" class="brand-icon"><span>Margin</span></div>
  <div id="sync-pill" class="sync-pill">&nbsp;</div>
</header>

<main id="view"><div class="empty-state"><p>Loading…</p></div></main>

<nav id="tabbar" aria-label="Main">
  <a href="#/add" data-tab="add">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    <span>Add</span>
  </a>
  <a href="#/browse" data-tab="browse">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V4H6.5A2.5 2.5 0 0 0 4 6.5v13z"/><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"/></svg>
    <span>Browse</span>
  </a>
  <a href="#/log" data-tab="log">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
    <span>Log</span>
  </a>
  <a href="#/heat" data-tab="heat">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="3" width="8" height="8" rx="1"/><rect x="13" y="3" width="8" height="8" rx="1"/><rect x="3" y="13" width="8" height="8" rx="1"/><rect x="13" y="13" width="8" height="8" rx="1"/></svg>
    <span>Heatmap</span>
  </a>
  <a href="#/more" data-tab="more">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="1.5" fill="currentColor"/><circle cx="5" cy="12" r="1.5" fill="currentColor"/><circle cx="19" cy="12" r="1.5" fill="currentColor"/></svg>
    <span>More</span>
  </a>
</nav>

<div id="auth-overlay" hidden>
  <div class="auth-card">
    <img src="/icons/icon-192.png" alt="" class="auth-icon">
    <h1>Margin</h1>
    <p id="auth-hint"></p>
    <form id="auth-form">
      <input type="password" id="auth-pass" placeholder="Passphrase" autocomplete="current-password" required minlength="8">
      <input type="password" id="auth-pass2" placeholder="Repeat passphrase" autocomplete="new-password" minlength="8" hidden>
      <button type="submit" class="btn-primary" id="auth-submit">Unlock</button>
    </form>
    <p class="auth-error" id="auth-error"></p>
  </div>
</div>

<div id="toast" hidden></div>

<script type="module" src="/js/app.js"></script>
</body>
</html>
